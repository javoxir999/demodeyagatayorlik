<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Demo Day - Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 30px;
            width: 280px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #dbdbdb;
            background-color: #fafafa;
            font-size: 13px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #a6a6a6;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            color: #ffffff;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover {
            background-color: #262626;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>demo deyga tayorgarlik</h2>
    <form action="/login" method="POST">
        <input type="text" name="login" placeholder="Login" required>
        <input type="password" name="password" placeholder="Parol" required>
        <button type="submit">Kirish</button>
    </form>
</div>

</body>
</html>
